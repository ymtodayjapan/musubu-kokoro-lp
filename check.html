<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英語ドキドキ度チェック｜世界と話そう、日本を伝えよう</title>
<meta name="description" content="夏休みの子どもが1分でできる、英語で話しかけるときの「自分のタイプ」診断。翻訳機じゃなく、自分の声で伝える一歩を後押しします。">
<style>
  :root{
    --ink:#2b2724;
    --ink-soft:#5b554f;
    --paper:#fbf8f3;
    --paper-2:#f4eee4;
    --gold:#b08d3f;
    --gold-soft:#d8c79b;
    --red:#a4262c;
    --red-soft:#c96a6c;
    --line:rgba(43,39,36,.14);
    --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
    --sans:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:var(--paper);
    line-height:1.9;
    font-size:16px;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .stage{max-width:560px;margin:0 auto;padding:0 22px}
  .serif{font-family:var(--serif)}
  .lead{color:var(--gold);font-size:13px;letter-spacing:.22em;margin-bottom:14px;text-align:center}

  /* top bar */
  .topbar{
    background:linear-gradient(180deg,#fdfbf7 0%,var(--paper-2) 100%);
    border-bottom:1px solid var(--line);
    text-align:center;padding:22px 22px 20px;
  }
  .topbar .knot{font-size:18px;color:var(--red);letter-spacing:.4em;margin-bottom:8px}
  .topbar .ttl{font-family:var(--serif);font-weight:500;font-size:20px;letter-spacing:.1em;color:var(--ink)}
  .topbar .brand{margin-top:6px;font-size:11px;letter-spacing:.2em;color:var(--gold)}

  /* screens */
  .screen{display:none;padding:40px 0 64px}
  .screen.active{display:block;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* start */
  .start{text-align:center}
  .start .emoji{font-size:46px;margin-bottom:10px}
  .start h1{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.5;letter-spacing:.06em;margin-bottom:8px}
  .start h1 b{color:var(--red);font-weight:500}
  .start .desc{font-family:var(--serif);font-size:16px;line-height:2;color:var(--ink-soft);margin-bottom:28px}
  .meta{font-size:12px;color:var(--ink-soft);letter-spacing:.1em;margin-top:18px}

  /* buttons */
  .btn{
    display:inline-block;border:none;cursor:pointer;width:100%;
    background:var(--red);color:#fff;text-decoration:none;text-align:center;
    font-family:var(--serif);font-size:18px;letter-spacing:.12em;
    padding:17px 28px;border-radius:8px;transition:background .2s,transform .1s;
  }
  .btn:hover{background:#8e1f25}
  .btn:active{transform:scale(.99)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--paper-2)}
  .btn.gold{background:var(--gold)}
  .btn.gold:hover{background:#977730}

  /* quiz */
  .progress{display:flex;align-items:center;gap:10px;margin-bottom:26px}
  .progress .bar{flex:1;height:6px;background:var(--paper-2);border-radius:99px;overflow:hidden}
  .progress .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s ease}
  .progress .num{font-family:var(--serif);font-size:13px;color:var(--gold);letter-spacing:.08em;white-space:nowrap}

  .qnum{font-family:var(--serif);color:var(--red);font-size:14px;letter-spacing:.1em;text-align:center;margin-bottom:6px}
  .qtext{font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.6;letter-spacing:.04em;text-align:center;margin-bottom:26px}
  .options{display:flex;flex-direction:column;gap:12px}
  .opt{
    cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;font-size:15px;line-height:1.6;color:var(--ink);text-align:left;
    transition:border-color .15s,background .15s,transform .1s;
  }
  .opt:hover{border-color:var(--gold-soft);background:#fffdf8}
  .opt:active{transform:scale(.99)}

  /* result */
  .result{text-align:center}
  .result .badge-emoji{font-size:60px;margin-bottom:6px;line-height:1}
  .result .badge-name{font-family:var(--serif);font-weight:500;font-size:28px;letter-spacing:.06em;color:var(--red);margin-bottom:4px}
  .result .badge-sub{font-size:13px;color:var(--ink-soft);letter-spacing:.08em;margin-bottom:22px}
  .result .msgcard{
    background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold);
    border-radius:12px;padding:24px 22px;margin-bottom:14px;
  }
  .result .msgcard .quote{font-family:var(--serif);font-size:19px;line-height:1.8;letter-spacing:.04em;color:var(--ink);margin-bottom:10px}
  .result .msgcard .body{font-size:14px;line-height:1.9;color:var(--ink-soft);margin:0}

  /* survey */
  .survey{
    background:var(--paper-2);border-radius:14px;padding:26px 22px;margin-top:24px;text-align:center;
  }
  .survey h3{font-family:var(--serif);font-weight:500;font-size:19px;letter-spacing:.05em;margin-bottom:6px;color:var(--ink)}
  .survey p{font-size:13px;color:var(--ink-soft);margin-bottom:18px}
  .days{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:18px}
  .day{
    cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:13px 0;font-family:var(--serif);font-size:16px;color:var(--ink);
    transition:all .15s;
  }
  .day:hover{border-color:var(--gold-soft)}
  .day.on{background:var(--gold);color:#fff;border-color:var(--gold)}
  .survey .thanks{font-size:13px;color:var(--gold);font-family:var(--serif);letter-spacing:.06em;min-height:1.6em;margin-bottom:8px}

  .actions{margin-top:22px;display:flex;flex-direction:column;gap:12px}

  footer{text-align:center;padding:30px 22px 40px;font-size:11px;color:var(--ink-soft);letter-spacing:.1em}

  @media(max-width:380px){
    .days{grid-template-columns:repeat(4,1fr);gap:7px}
    .day{font-size:15px}
    .start h1{font-size:26px}
    .qtext{font-size:20px}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="knot">むすぶ</div>
  <div class="ttl">英語ドキドキ度チェック</div>
  <div class="brand">世界と話そう、日本を伝えよう ｜ Today Japan</div>
</div>

<div class="stage">

  <!-- START -->
  <section class="screen active" id="screen-start">
    <div class="start">
      <div class="emoji">🌏</div>
      <h1>外国人に話しかけるとき、<br>あなたは<b>どんなタイプ？</b></h1>
      <p class="desc">
        9月、名古屋でアジア大会。<br>
        翻訳機じゃなくて、<br>「自分の声」で話してみよう。
      </p>
      <button class="btn" onclick="start()">チェックをはじめる</button>
      <p class="meta">ぜんぶで5問・約1分</p>
    </div>
  </section>

  <!-- QUIZ -->
  <section class="screen" id="screen-quiz">
    <div class="progress">
      <span class="num" id="pnum">1 / 5</span>
      <div class="bar"><i id="pbar"></i></div>
    </div>
    <div class="qnum" id="qnum">Q1</div>
    <div class="qtext" id="qtext"></div>
    <div class="options" id="options"></div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="screen-result">
    <div class="result">
      <div class="badge-emoji" id="rEmoji"></div>
      <div class="badge-name" id="rName"></div>
      <div class="badge-sub" id="rSub"></div>
      <div class="msgcard">
        <p class="quote" id="rQuote"></p>
        <p class="body" id="rBody"></p>
      </div>

      <div class="survey">
        <h3>参加しやすい曜日は？</h3>
        <p>この夏、いっしょに世界と話そう。<br>参加しやすい曜日をえらんでね。</p>
        <div class="days" id="days"></div>
        <div class="thanks" id="surveyThanks"></div>
        <a class="btn gold" id="surveySend" href="#">この曜日でアンケートを送る</a>
      </div>

      <div class="actions">
        <button class="btn ghost" onclick="restart()">もう一度チェックする</button>
      </div>
    </div>
  </section>

</div>

<footer>
  © Today Japan Co., Ltd. ｜ 世界と話そう、日本を伝えよう
</footer>

<script>
  // ---- 診断データ ----
  var TYPES = {
    explorer:{emoji:"🌏",name:"ドキドキ探検家",sub:"きんちょうするけど、挑戦したい",
      quote:"その勇気が、宝物。",
      body:"心臓がドキドキするのは、一歩ふみ出そうとしている証拠。世界はあなたの「やってみたい」を待っています。最初のHelloが、いちばんかっこいい。"},
    hero:{emoji:"☀️",name:"にこにこ勇者",sub:"笑顔で飛びこめる",
      quote:"君の笑顔は、世界共通の言葉。",
      body:"言葉がうまく出なくても、笑顔があればもう半分伝わっています。あなたのあかるさは、出会った人の心をひらく力。どんどん話しかけてみよう。"},
    prep:{emoji:"📖",name:"じっくり準備さん",sub:"練習してから話したい",
      quote:"準備した言葉は、必ず届く。",
      body:"考えてから話すのは、相手を大切にしている証拠です。ひとことだけでも練習して持っていこう。準備したその言葉は、まっすぐ相手の心にとどきます。"},
    translator:{emoji:"📱",name:"翻訳機たより星人",sub:"まだ機械に頼りがち",
      quote:"次は“自分の声”を試してみよう。",
      body:"便利な翻訳機もいいけれど、あなたの声で伝わった時のうれしさは特別です。「Hello」「Thank you」だけでもOK。自分の言葉が通じる感動を、この夏プレゼントします。"}
  };

  var QUESTIONS = [
    {q:"外国人の人を街で見かけたら？", a:[
      {t:"ちょっとドキドキするけど、話してみたい",type:"explorer"},
      {t:"ニコッと笑って手をふる",type:"hero"},
      {t:"なんて言おうか、まず考える",type:"prep"},
      {t:"スマホの翻訳を準備する",type:"translator"}
    ]},
    {q:"知らない英語の単語が出てきたら？", a:[
      {t:"ジェスチャーで伝えてみる",type:"explorer"},
      {t:"笑顔で「OK!」と乗りきる",type:"hero"},
      {t:"メモや辞書で調べる",type:"prep"},
      {t:"翻訳アプリに入れる",type:"translator"}
    ]},
    {q:"アジア大会で海外の選手に会えたら？", a:[
      {t:"勇気を出して「Hello!」と声をかける",type:"explorer"},
      {t:"笑顔で写真をおねがいする",type:"hero"},
      {t:"頼み方を先に練習しておく",type:"prep"},
      {t:"翻訳アプリの画面を見せる",type:"translator"}
    ]},
    {q:"英語で「ありがとう」を伝えるなら？", a:[
      {t:"自分の言葉で「Thank you!」",type:"explorer"},
      {t:"笑顔で大きく「Thank you!」",type:"hero"},
      {t:"発音を練習してから言う",type:"prep"},
      {t:"翻訳機に話してもらう",type:"translator"}
    ]},
    {q:"自分の気持ちを伝えるとき、たよりにするのは？", a:[
      {t:"勇気とチャレンジする心",type:"explorer"},
      {t:"笑顔と元気",type:"hero"},
      {t:"準備と練習",type:"prep"},
      {t:"機械やアプリ",type:"translator"}
    ]}
  ];

  // ---- 状態 ----
  var current = 0;
  var scores = {explorer:0,hero:0,prep:0,translator:0};
  var selectedDay = null;

  function show(id){
    var s = document.querySelectorAll(".screen");
    for(var i=0;i<s.length;i++) s[i].classList.remove("active");
    document.getElementById(id).classList.add("active");
    window.scrollTo(0,0);
  }

  function start(){
    current = 0;
    scores = {explorer:0,hero:0,prep:0,translator:0};
    show("screen-quiz");
    render();
  }

  function render(){
    var Q = QUESTIONS[current];
    document.getElementById("pnum").textContent = (current+1)+" / "+QUESTIONS.length;
    document.getElementById("pbar").style.width = ((current)/QUESTIONS.length*100)+"%";
    document.getElementById("qnum").textContent = "Q"+(current+1);
    document.getElementById("qtext").textContent = Q.q;

    var box = document.getElementById("options");
    box.innerHTML = "";
    Q.a.forEach(function(opt){
      var b = document.createElement("button");
      b.className = "opt";
      b.textContent = opt.t;
      b.onclick = function(){ choose(opt.type); };
      box.appendChild(b);
    });
  }

  function choose(type){
    scores[type]++;
    current++;
    if(current < QUESTIONS.length){
      render();
    } else {
      document.getElementById("pbar").style.width = "100%";
      showResult();
    }
  }

  function topType(){
    // 同点時は QUESTIONS の出現＝TYPES定義順を優先（explorer→hero→prep→translator）
    var order = ["explorer","hero","prep","translator"];
    var best = order[0];
    for(var i=1;i<order.length;i++){
      if(scores[order[i]] > scores[best]) best = order[i];
    }
    return best;
  }

  function showResult(){
    var t = TYPES[topType()];
    document.getElementById("rEmoji").textContent = t.emoji;
    document.getElementById("rName").textContent = t.name;
    document.getElementById("rSub").textContent = t.sub;
    document.getElementById("rQuote").textContent = t.quote;
    document.getElementById("rBody").textContent = t.body;
    show("screen-result");
  }

  // ---- 曜日アンケート（見た目のみ・送信先は後で差し込み）----
  var DAYS = ["月","火","水","木","金","土","日"];
  (function buildDays(){
    var box = document.getElementById("days");
    DAYS.forEach(function(d){
      var b = document.createElement("button");
      b.className = "day";
      b.textContent = d;
      b.onclick = function(){
        var all = box.querySelectorAll(".day");
        for(var i=0;i<all.length;i++) all[i].classList.remove("on");
        b.classList.add("on");
        selectedDay = d;
        document.getElementById("surveyThanks").textContent = "「"+d+"曜日」をえらんだよ";
      };
      box.appendChild(b);
    });
  })();

  document.getElementById("surveySend").onclick = function(e){
    // TODO: 送信先（Googleフォーム等）が決まったら href を差し替える
    if(!selectedDay){
      e.preventDefault();
      document.getElementById("surveyThanks").textContent = "まず曜日をえらんでね";
      return;
    }
    e.preventDefault();
    document.getElementById("surveyThanks").textContent = "「"+selectedDay+"曜日」で送信しました（仮）！ありがとう🌏";
  };

  function restart(){
    selectedDay = null;
    var all = document.querySelectorAll(".day");
    for(var i=0;i<all.length;i++) all[i].classList.remove("on");
    document.getElementById("surveyThanks").textContent = "";
    show("screen-start");
  }
</script>

</body>
</html>
